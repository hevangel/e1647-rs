[package]
name = "e1647-rs"
version = "0.1.0"
edition = "2024"
description = "Experimental Rust tooling for the IEEE 1647 e verification language"
license = "Apache-2.0"
repository = "https://github.com/hevangel/e1647-rs"
readme = "README.md"
keywords = ["verification", "eda", "parser", "language", "ieee1647"]
categories = ["development-tools", "parser-implementations"]
publish = false

[lib]
name = "e1647"
path = "src/lib.rs"

[[bin]]
name = "e1647"
path = "src/main.rs"

[features]
# Constraint-solver backend for `gen` (Pumpkin, pure Rust CP solver).
# Off by default: the crate's build script needs a C compiler, which the
# local windows-gnu toolchain lacks; CI verifies the feature on ubuntu.
solver-pumpkin = [
    "dep:pumpkin-solver",
    "dep:pumpkin-constraints",
    "dep:pumpkin-conflict-resolvers",
]

[dependencies]
pumpkin-conflict-resolvers = { version = "0.5", optional = true }
pumpkin-constraints = { version = "0.5", optional = true }
pumpkin-solver = { version = "0.5", optional = true }
