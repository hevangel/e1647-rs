name: Rust CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  # The pumpkin solver backend is verified here: it is a pure-Rust crate,
  # but its build script needs a C compiler, which the local windows-gnu
  # toolchain does not have.
  check-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  # The core library (lexer/parser/elaborator/interpreter) compiles for
  # wasm32. The one backend that needs a child process (the xezim VPI
  # bridge) is native-only — under target_arch = "wasm32" it is not
  # compiled and the null simulator backend answers there (see
  # src/hdl.rs). A compilation check only: there is no browser sandbox
  # API and no wasm runtime test yet.
  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --all-targets
